[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "posterior-operator"
version = "0.1.0"
description = "Neural Conditional Probability (NCP): operator-theoretic conditional distributions for uncertainty quantification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0", "numpy>=1.22"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["posterior_operator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
